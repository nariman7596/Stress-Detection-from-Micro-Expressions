name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite deliberately runs without MediaPipe and without a camera:
      # the synthetic face is built analytically and the detector is injectable.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless pytest pyflakes

      - name: Lint
        run: python -m pyflakes src tests main.py

      - name: Run tests
        run: python -m pytest tests/ -q
